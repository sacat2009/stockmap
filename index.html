<h1>StockMap</h1>
<p>StockMap 是一個個人使用的 Windows 桌面投資記帳與看盤程式，只在擁有者自己的電腦上執行，不對外提供服務。</p>
<p>它可以在擁有者授權後，把財報日、總經數據公布時間等行程加入擁有者自己的 Google 日曆，並讀取他的日曆行程用於每日簡報。</p>
